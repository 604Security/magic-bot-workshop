<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn Dance Party</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#2b0f4c; --bg2:#5a1a7a; --card:#ffffff; --ink:#3a1650; }
  * { box-sizing: border-box; }
  html { background:#2b0f4c; }
  body { margin:0; min-height:100vh; font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background: radial-gradient(circle at 20% 10%, #ff7ad9 0, transparent 40%),
                radial-gradient(circle at 80% 90%, #6ad7ff 0, transparent 40%),
                linear-gradient(160deg,var(--bg1),var(--bg2)); padding:24px 16px 60px; }
  h1 { text-align:center; color:#fff; font-size:clamp(28px,5vw,52px); margin:0 0 6px;
    text-shadow:0 4px 0 #ff4fb8, 0 8px 20px #0006; }
  .sub { text-align:center; color:#ffe6fb; font-size:clamp(16px,2.4vw,22px); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; max-width:1300px; margin:0 auto; }
  .tile { position:relative; background:var(--card); border-radius:26px; padding:18px 16px 16px; text-align:center;
    box-shadow:0 8px 0 var(--edge), 0 14px 30px #0005; cursor:pointer; transition:transform .15s; border:4px solid var(--edge); }
  .tile:hover { transform:translateY(-4px) rotate(-1deg); }
  .tile.picked { transform:scale(1.04); box-shadow:0 0 0 6px #fff, 0 0 40px 10px var(--edge); }
  .num { position:absolute; top:-14px; left:-10px; width:54px; height:54px; border-radius:50%; background:var(--edge);
    color:#fff; font-size:30px; font-weight:700; display:grid; place-items:center; border:4px solid #fff; box-shadow:0 4px 10px #0004; }
  .stage { height:150px; background:#05060A !important; display:flex; align-items:center; justify-content:center; white-space:nowrap; font-size:64px; position:relative; overflow:hidden;
    border-radius:18px; background:var(--soft); margin-bottom:10px; }
  .name { font-size:24px; font-weight:700; line-height:1.15; margin:4px 0 6px; }
  .repo { font-family:ui-monospace,monospace; font-size:13px; color:#7a5a8a; background:#f4eefa; border-radius:8px; padding:4px 6px; display:inline-block; }
  .say { margin-top:10px; border:none; background:var(--edge); color:#fff; font:inherit; font-size:18px; border-radius:999px; padding:6px 16px; cursor:pointer; }
  .banner { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(150%); background:#fff; color:var(--ink);
    font-size:24px; font-weight:700; padding:14px 28px; border-radius:999px; box-shadow:0 10px 30px #0006; transition:transform .3s, opacity .3s; opacity:0; z-index:9; text-align:center; max-width:calc(100% - 32px); }
  .banner.show { transform:translateX(-50%) translateY(0); opacity:1; }
  /* animations */
  @keyframes bob { 50% { transform:translateY(-12px) rotate(4deg);} }
  @keyframes spin { to { transform:rotate(360deg);} }
  @keyframes peek { 0%,100%{transform:translateX(-90px)} 40%,60%{transform:translateX(0)} }
  @keyframes pulse { 50% { transform:scale(1.2);} }
  @keyframes hop { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-26px)} 50%{transform:translateY(0)} }
  @keyframes twinkle { 50% { opacity:.2; transform:scale(.6);} }
  @keyframes rain { from { transform:translateY(-70px);} to { transform:translateY(70px);} }
  @keyframes rainbow { to { filter:hue-rotate(360deg);} }
  .bob{display:inline-block;animation:bob 1.6s ease-in-out infinite} .spin{animation:spin 3s linear infinite}
  .peek{animation:peek 3s ease-in-out infinite} .pulse{display:inline-block;animation:pulse 1.2s ease-in-out infinite}
  .hop{display:inline-block;animation:hop 1.1s ease-in-out infinite} .rainbow{animation:rainbow 3s linear infinite}
  .spark { position:absolute; font-size:22px; animation:twinkle 1.4s ease-in-out infinite; }
  .code { position:absolute; font-family:monospace; font-size:16px; color:#3cff7a; animation:rain 1.8s linear infinite; }
  .stage canvas { width:100%; max-width:216px; image-rendering:pixelated; }
  .pal { font-size:30px; margin-top:4px; }
  .clap { margin-top:10px; margin-left:6px; border:3px solid var(--edge); background:#fff; color:var(--edge); font:inherit; font-size:18px; border-radius:999px; padding:4px 14px; cursor:pointer; }
  .tile.picked .name::after { content:" ✅"; }
</style>
</head>
<body>
<h1>🦄💃 Unicorn Dance Party! 🎶</h1>
<p class="sub">How should Sparkle's unicorn dance when you clap? Pick a number, or pick a few!</p>
<div class="grid" id="grid"></div>
<div class="banner" id="banner"></div>
<script>
const UNICORN = ['000000000','000000000','000000010','000000030','000040060','0000400c0','000460040','001ff0380','003ff0700','007fd8f00','007fcdc00','00ffcf800','01ffffe00','01fff8f00','01fff0780','03dff4780','03dfe07e0','07fef07f8','07bdf07fc','07fcf8ffe','077cffffe','0ef8ffffe','0ef87ffe7','0df87ffff','0df9ffffe','1df1ffffe','1df1ffcee','1df1fef1c','1df1fe7f8','3de1fe0c0','3de1ff000','3de1ff000','3fe1ff000','7bc1ff000','7fc1ff000','77c3ff000','7fc3ff800','6f83ff800','6f83ff800','7fc3ff800'];
const BITS = UNICORN.map(h => parseInt(h, 16).toString(2).padStart(36, '0'));
const W = 72, H = 40, DANCE_MS = 3000;

// A tiny pretend screen: 72x40 white-on-black pixels, exactly like Sparkle's.
function screen(cv) {
  const g = cv.getContext('2d'), s = cv.width / W;
  const px = new Uint8Array(W * H);
  return {
    set(x, y, on = 1) { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < W && y >= 0 && y < H) px[y * W + x] = on; },
    unicorn(x0, y0, flip) { BITS.forEach((row, y) => [...row].forEach((b, x) => { if (b === '1') this.set(x0 + (flip ? 35 - x : x), y0 + y); })); },
    sparkle(x, y, r) { for (let i = -r; i <= r; i++) { this.set(x + i, y); this.set(x, y + i); } },
    note(x, y) { for (let i = 0; i < 7; i++) this.set(x + 3, y + i); this.set(x + 4, y); this.set(x + 5, y + 1);
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 3; dx++) this.set(x + dx + 1, y + 6 + dy); this.set(x, y + 7); },
    heart(x, y, r) { for (let dy = -r; dy <= 2 * r + 2; dy++) for (let dx = -2 * r - 1; dx <= 2 * r + 1; dx++) {
      const inL = (dx + r) ** 2 + dy ** 2 <= r * r + 1, inR = (dx - r) ** 2 + dy ** 2 <= r * r + 1;
      const inT = dy > 0 && Math.abs(dx) <= (2 * r + 1) * (1 - dy / (2 * r + 3));
      if (inL || inR || inT) this.set(x + dx, y + dy); } },
    show(invert) {
      g.fillStyle = invert ? '#EAF6FF' : '#05060A'; g.fillRect(0, 0, cv.width, cv.height);
      g.fillStyle = invert ? '#05060A' : '#EAF6FF';
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[y * W + x]) g.fillRect(x * s, y * s, s - 0.6, s - 0.6);
    }
  };
}
const wave = (t, hz) => Math.sin(t / 1000 * hz * 2 * Math.PI);

// Each dance draws one frame at time t (ms since the clap).
const dances = [
  { n: "Bouncy Hop", edge: "#ff4fb8", say: "Boing boing boing!", draw(sc, t) {
      sc.unicorn(18, -Math.abs(wave(t, 2)) * 9 + 2, false); sc.sparkle(60, 6, 2); sc.sparkle(8, 10, t % 400 < 200 ? 2 : 1); } },
  { n: "Wiggle Waggle", edge: "#8a4dff", say: "Wiggle wiggle!", draw(sc, t) {
      sc.unicorn(18 + wave(t, 2.5) * 10, 0, false); } },
  { n: "Flip Flop", edge: "#ff8a00", say: "Flip! Flop! Flip! Flop!", draw(sc, t) {
      const k = Math.floor(t / 300); sc.unicorn(18, k % 2 ? -3 : 0, k % 2 === 1); } },
  { n: "Disco Flash", edge: "#e0007a", say: "Disco party!", invert: t => Math.floor(t / 250) % 2 === 1, draw(sc, t) {
      sc.unicorn(4, 0, false); const k = Math.floor(t / 250) % 3;
      sc.note(44, 4 + k * 3); sc.note(58, 14 - k * 3); sc.note(50, 26 - k); } },
  { n: "Moonwalk", edge: "#222", say: "Smooth moves!", draw(sc, t) {
      sc.unicorn(-36 + (t / DANCE_MS) * 110, Math.floor(t / 150) % 2, true); } },
  { n: "Star Jump", edge: "#3366ff", say: "Jump to the stars!", draw(sc, t) {
      const p = (t % 1500) / 1500, y = -Math.sin(p * Math.PI) * 14; sc.unicorn(18, y + 2, false);
      if (p > 0.3 && p < 0.8) { const r = Math.round((p - 0.3) * 12); sc.sparkle(10, 6, r); sc.sparkle(62, 8, r); sc.sparkle(56, 30, r - 1); } } },
  { n: "Shake Shake", edge: "#00a37a", say: "Shake shake shake!", draw(sc, t) {
      const k = Math.floor(t / 60); sc.unicorn(18 + ((k * 7) % 5) - 2, ((k * 3) % 3) - 1, false); } },
  { n: "Heart Twirl", edge: "#c2408a", say: "I love dancing!", draw(sc, t) {
      sc.unicorn(4 + wave(t, 1.5) * 3, 0, Math.floor(t / 750) % 2 === 1);
      for (let i = 0; i < 3; i++) { const p = ((t / 1500) + i / 3) % 1; sc.heart(48 + i * 8, 38 - p * 40, i === 1 ? 2 : 1); } } },
];

const grid = document.getElementById('grid'), banner = document.getElementById('banner'), tiles = [], picks = new Set();
function say(text){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.pitch = 1.4; u.rate = .95; speechSynthesis.speak(u); } catch(e){} }
dances.forEach((d, i) => {
  const t = document.createElement('div'); t.className = 'tile'; t.style.setProperty('--edge', d.edge);
  t.innerHTML = `<div class="num">${i+1}</div><div class="stage"><canvas width="216" height="120"></canvas></div>
    <div class="name">${d.n}</div>
    <button class="say">🔊 Say it</button><button class="clap">👏 Clap!</button>`;
  const tile = { el: t, cv: t.querySelector('canvas'), d, start: -i * 600 };
  tiles.push(tile);
  t.querySelector('.say').addEventListener('click', e => { e.stopPropagation(); say(`Number ${i+1}. ${d.n}! ${d.say}`); });
  t.querySelector('.clap').addEventListener('click', e => { e.stopPropagation(); tile.start = performance.now(); });
  t.addEventListener('click', () => {
    picks.has(i + 1) ? picks.delete(i + 1) : picks.add(i + 1);
    t.classList.toggle('picked', picks.has(i + 1));
    const list = [...picks].sort((a, b) => a - b);
    banner.textContent = list.length ? `🎉 You picked: ${list.join(', ')}! 💃` : '';
    banner.classList.toggle('show', list.length > 0);
    if (picks.has(i + 1)) say(`Yay! Number ${i+1}. ${d.n}!`);
  });
  grid.appendChild(t);
});
// Every dance plays for 3 seconds after a clap, then rests for a moment and claps again by itself.
(function loop(now) {
  tiles.forEach(tile => {
    let t = now - tile.start; if (t > DANCE_MS + 900) { tile.start = now; t = 0; }
    const sc = screen(tile.cv);
    if (t < DANCE_MS) { tile.d.draw(sc, t); sc.show(tile.d.invert && tile.d.invert(t)); }
    else { sc.unicorn(18, 0, false); sc.show(false); }
  });
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
