<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkle Gets a Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English&family=Henny+Penny&family=Dancing+Script:wght@700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#2b0f4c; --bg2:#5a1a7a; --card:#ffffff; --ink:#3a1650; }
  * { box-sizing: border-box; }
  html { background:#2b0f4c; }
  body { margin:0; min-height:100vh; font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    background: radial-gradient(circle at 20% 10%, #ff7ad9 0, transparent 40%),
                radial-gradient(circle at 80% 90%, #6ad7ff 0, transparent 40%),
                linear-gradient(160deg,var(--bg1),var(--bg2)); padding:24px 16px 60px; }
  h1 { text-align:center; color:#fff; font-size:clamp(28px,5vw,52px); margin:0 0 6px;
    text-shadow:0 4px 0 #ff4fb8, 0 8px 20px #0006; }
  .sub { text-align:center; color:#ffe6fb; font-size:clamp(16px,2.4vw,22px); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; max-width:1300px; margin:0 auto; }
  .tile { position:relative; background:var(--card); border-radius:26px; padding:18px 16px 16px; text-align:center;
    box-shadow:0 8px 0 var(--edge), 0 14px 30px #0005; cursor:pointer; transition:transform .15s; border:4px solid var(--edge); }
  .tile:hover { transform:translateY(-4px) rotate(-1deg); }
  .tile.picked { transform:scale(1.04); box-shadow:0 0 0 6px #fff, 0 0 40px 10px var(--edge); }
  .num { position:absolute; top:-14px; left:-10px; width:54px; height:54px; border-radius:50%; background:var(--edge);
    color:#fff; font-size:30px; font-weight:700; display:grid; place-items:center; border:4px solid #fff; box-shadow:0 4px 10px #0004; }
  .stage { height:150px; background:#05060A !important; display:flex; align-items:center; justify-content:center; white-space:nowrap; font-size:64px; position:relative; overflow:hidden;
    border-radius:18px; background:var(--soft); margin-bottom:10px; }
  .name { font-size:24px; font-weight:700; line-height:1.15; margin:4px 0 6px; }
  .repo { font-family:ui-monospace,monospace; font-size:13px; color:#7a5a8a; background:#f4eefa; border-radius:8px; padding:4px 6px; display:inline-block; }
  .say { margin-top:10px; border:none; background:var(--edge); color:#fff; font:inherit; font-size:18px; border-radius:999px; padding:6px 16px; cursor:pointer; }
  .banner { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(150%); background:#fff; color:var(--ink);
    font-size:24px; font-weight:700; padding:14px 28px; border-radius:999px; box-shadow:0 10px 30px #0006; transition:transform .3s, opacity .3s; opacity:0; z-index:9; text-align:center; max-width:calc(100% - 32px); }
  .banner.show { transform:translateX(-50%) translateY(0); opacity:1; }
  /* animations */
  @keyframes bob { 50% { transform:translateY(-12px) rotate(4deg);} }
  @keyframes spin { to { transform:rotate(360deg);} }
  @keyframes peek { 0%,100%{transform:translateX(-90px)} 40%,60%{transform:translateX(0)} }
  @keyframes pulse { 50% { transform:scale(1.2);} }
  @keyframes hop { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-26px)} 50%{transform:translateY(0)} }
  @keyframes twinkle { 50% { opacity:.2; transform:scale(.6);} }
  @keyframes rain { from { transform:translateY(-70px);} to { transform:translateY(70px);} }
  @keyframes rainbow { to { filter:hue-rotate(360deg);} }
  .bob{display:inline-block;animation:bob 1.6s ease-in-out infinite} .spin{animation:spin 3s linear infinite}
  .peek{animation:peek 3s ease-in-out infinite} .pulse{display:inline-block;animation:pulse 1.2s ease-in-out infinite}
  .hop{display:inline-block;animation:hop 1.1s ease-in-out infinite} .rainbow{animation:rainbow 3s linear infinite}
  .spark { position:absolute; font-size:22px; animation:twinkle 1.4s ease-in-out infinite; }
  .code { position:absolute; font-family:monospace; font-size:16px; color:#3cff7a; animation:rain 1.8s linear infinite; }
  .stage canvas { width:100%; max-width:216px; image-rendering:pixelated; }
  .pal { font-size:30px; margin-top:4px; }
  .clap { margin-top:10px; margin-left:6px; border:3px solid var(--edge); background:#fff; color:var(--edge); font:inherit; font-size:18px; border-radius:999px; padding:4px 14px; cursor:pointer; }
  .tile.picked .name::after { content:" ✅"; }
  .what { font-size:16px; color:#6a4a7a; margin:2px 0 4px; min-height:40px; }
  .mini { position:relative; height:190px; border-radius:16px; overflow:hidden; margin-bottom:10px; padding:10px 10px 0;
    background:var(--bg); color:var(--ink); font-family:var(--font); text-align:center; }
  .mini h3 { margin:2px 0 8px; font-size:26px; font-family:var(--title); color:var(--title-c); text-shadow:var(--glow); position:relative; z-index:2; }
  .mini .mt { display:grid; grid-template-columns:1fr 1fr; gap:6px; position:relative; z-index:2; }
  .mini .mt span { background:var(--tile); color:var(--tile-ink); border:2px solid var(--edge2); border-radius:var(--r); padding:6px 4px; font-size:14px; box-shadow:var(--tshadow); }
  .deco { position:absolute; z-index:1; pointer-events:none; font-size:18px; }
  @keyframes float { 50% { transform:translateY(-8px); } }
  @keyframes tw { 50% { opacity:.15; } }
  @keyframes walk { 0% { opacity:0; } 20%,60% { opacity:1; } 100% { opacity:0; } }
  @keyframes flick { 0%,100% { transform:scale(1) rotate(-2deg); } 50% { transform:scale(1.15) rotate(2deg); } }
  @keyframes bub { from { transform:translateY(20px); opacity:1; } to { transform:translateY(-160px); opacity:0; } }
  .cyd { position:relative; margin:0 auto 10px; width:100%; max-width:230px; aspect-ratio:4/3.3; background:#f2c200; border-radius:12px; padding:10px 18px 14px 10px; box-shadow:inset 0 0 0 3px #d4a600; }
  .cyd .scr { position:relative; width:100%; height:100%; border-radius:4px; overflow:hidden; background:#111; color:#fff; font-family:'Fredoka',sans-serif; }
  .cyd .led { position:absolute; right:6px; top:50%; width:8px; height:8px; border-radius:50%; background:var(--led,#f0f); box-shadow:0 0 8px var(--led,#f0f); }
  .cyd .scr .t { position:absolute; left:0; right:0; text-align:center; font-weight:700; }
  .what { font-size:16px; color:#6a4a7a; margin:2px 0 4px; min-height:40px; }
  .a { position:absolute; }
  @keyframes bob { 50% { transform:translateY(-6px); } }
  @keyframes fly { from { left:-20%; } to { left:110%; } }
  @keyframes zoom { 0% { left:10%; top:20%; } 25% { left:70%; top:60%; } 50% { left:30%; top:70%; } 75% { left:80%; top:15%; } 100% { left:10%; top:20%; } }
  @keyframes pop { 0%,100% { transform:scale(.8); } 50% { transform:scale(1.15); } }
  @keyframes fade { 0%,100% { opacity:0; } 30%,70% { opacity:1; } }
  @keyframes rise { from { transform:translateY(0); opacity:1; } to { transform:translateY(-80px); opacity:0; } }
  @keyframes tap { 0%,100% { transform:scale(1); } 50% { transform:scale(.85); filter:brightness(1.5); } }
</style>
</head>
<body>
<h1>🤖💛 Sparkle Gets a Friend!</h1>
<p class="sub">The yellow touchscreen can talk to Sparkle! What should they do together? Pick a number!</p>
<div class="grid" id="grid"></div>
<div class="banner" id="banner"></div>
<script>
const ideas = [
  { n:"Spellbook Remote", edge:"#6a3bd1", led:"#a98bff", what:"Tap a spell on the yellow screen and Sparkle casts it, with a sound!",
    say:"Tap a spell and Sparkle casts it. Lumos!", scr:`<div style="background:linear-gradient(#2a1a5e,#120a2e);position:absolute;inset:0"></div>
      <div class="t" style="top:6%;color:#ffe27a;font-size:15px">📖 Spellbook</div>
      ${['💡 Lumos','⭐ Accio','🪶 Leviosa','⚡ Expelliarmus'].map((s,i)=>`<div class="a" style="left:${i%2?52:6}%;top:${30+Math.floor(i/2)*32}%;width:42%;background:#3d2a7a;border:2px solid #a98bff;border-radius:8px;font-size:10px;padding:5px 2px;text-align:center;animation:tap 2.4s ${i*.6}s infinite">${s}</div>`).join('')}` },
  { n:"Colour Sorting Hat", edge:"#ae0001", led:"#ff2a2a", what:"Shake Sparkle and the yellow screen shows your house in full colour, with a fanfare!",
    say:"Shake Sparkle and the big screen shows your house! Gryffindor!", scr:`<div style="position:absolute;inset:0;background:#ae0001;animation:fade 3s infinite"></div>
      <div class="t" style="top:18%;font-size:44px;animation:pop 1.5s infinite">🦁</div>
      <div class="t" style="top:62%;color:#ffc93c;font-size:18px">GRYFFINDOR!</div>
      <div class="t" style="top:82%;font-size:11px;color:#ffe6a8">🎺 ta-da! 🎺</div>` },
  { n:"Two-way Owl Post", edge:"#5a6a8a", led:"#9cf", what:"Send letters back and forth! Tap a letter and an owl flies it to Sparkle. Sparkle can write back!",
    say:"Hoo hoo! Send letters back and forth with Sparkle!", scr:`<div style="position:absolute;inset:0;background:linear-gradient(#7ec8ff,#dff3ff)"></div>
      <div class="a" style="top:25%;font-size:34px;animation:fly 3s linear infinite">🦉✉️</div>
      <div class="t" style="top:72%;color:#234;font-size:13px">📬 Letter for Sparkle!</div>` },
  { n:"Snitch Scoreboard", edge:"#c8a000", led:"#ffd700", what:"Play Catch the Snitch on Sparkle. The yellow screen shows a big colourful score and cheers!",
    say:"Clap to catch the snitch! The big screen keeps score!", scr:`<div style="position:absolute;inset:0;background:radial-gradient(#3b2a00,#120d00)"></div>
      <div class="a" style="font-size:22px;animation:zoom 3s linear infinite">🟡</div>
      <div class="t" style="top:30%;color:#ffd700;font-size:48px;animation:pop 1s infinite">7⭐</div>
      <div class="t" style="top:78%;color:#fff;font-size:12px">🏆 You are a Seeker!</div>` },
  { n:"Potion Lab", edge:"#2f6b4f", led:"#3dff6e", what:"Tap ingredients on the touchscreen. They drop into Sparkle's cauldron and the big screen bubbles in colour!",
    say:"Bubble bubble! Tap the ingredients and make a potion!", scr:`<div style="position:absolute;inset:0;background:linear-gradient(#1b2620,#0d1410)"></div>
      <div class="t" style="top:4%;font-size:15px;letter-spacing:2px">🦄 🐸 🌈 🕷️ ⭐</div>
      <div class="t" style="top:42%;font-size:46px">🧪</div>
      ${[0,1,2,3].map(i=>`<div class="a" style="left:${30+i*12}%;top:60%;color:#7dff9d;font-size:14px;animation:rise ${1.4+i*.3}s ${i*.3}s infinite">○</div>`).join('')}` },
  { n:"Marauder's Map", edge:"#7a4a1f", led:"#c90", what:"A secret map! Footprints walk around, and you can peek through Sparkle's camera. (A bit of spy hacking!)",
    say:"I solemnly swear that I am up to no good! Spy through Sparkle's eyes!", scr:`<div style="position:absolute;inset:0;background:#f1deb0"></div>
      <div class="t" style="top:5%;color:#5a3412;font-size:13px;font-family:serif">The Marauder's Map</div>
      ${[0,1,2,3,4,5].map(i=>`<div class="a" style="left:${10+i*13}%;top:${55-(i%2)*10}%;font-size:12px;opacity:0;animation:fade 3s ${i*.4}s infinite">👣</div>`).join('')}
      <div class="a" style="right:6%;bottom:8%;width:34%;height:30%;background:#333;border:2px solid #5a3412;color:#fff;font-size:9px;display:grid;place-items:center">📷 Sparkle</div>` },
];
const grid = document.getElementById('grid'), banner = document.getElementById('banner');
function say(text){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.pitch = 1.3; u.rate = .95; speechSynthesis.speak(u); } catch(e){} }
ideas.forEach((d, i) => {
  const t = document.createElement('div'); t.className = 'tile'; t.style.setProperty('--edge', d.edge);
  t.innerHTML = `<div class="num">${i+1}</div><div class="cyd" style="--led:${d.led}"><div class="scr">${d.scr}</div><div class="led"></div></div>
    <div class="name">${d.n}</div><div class="what">${d.what}</div><button class="say">🔊 Say it</button>`;
  t.querySelector('.say').addEventListener('click', e => { e.stopPropagation(); say(`Number ${i+1}. ${d.n}. ${d.say}`); });
  t.addEventListener('click', () => {
    document.querySelectorAll('.tile').forEach(el => el.classList.remove('picked')); t.classList.add('picked');
    banner.textContent = `💛 Number ${i+1}: ${d.n}! 🤖`; banner.classList.add('show'); say(`Yay! Number ${i+1}. ${d.n}!`);
  });
  grid.appendChild(t);
});
</script>
</body>
</html>
